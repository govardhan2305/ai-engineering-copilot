spring.application.name=ai-engineering-copilot
server.port=8080

# ===============================
# Ollama
# ===============================
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:1.5b
spring.ai.ollama.embedding.model=nomic-embed-text

# ===============================
# Qdrant
# ===============================
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=project_documents
spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.use-tls=false

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===============================
# MCP Client
# ===============================
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=ai-engineering-copilot
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.type=SYNC

spring.ai.mcp.client.streamable-http.connections.project-server.url=http://127.0.0.1:8000
spring.ai.mcp.client.streamable-http.connections.project-server.endpoint=/mcp